[package]
name = "activeledger"
version = "2.1.0"
edition = "2021"
# Verified by building on it, not guessed. The floor comes from the
# dependency graph rather than from this crate's own code: reqwest pulls in
# the icu crates, which require 1.88.
rust-version = "1.88"

description = "Rust SDK for Activeledger, with post-quantum identity support (ML-DSA-65)"
repository = "https://github.com/activeledger/SDK-Rust"
homepage = "https://activeledger.io"
readme = "README.md"
keywords = ["activeledger", "dlt", "blockchain", "distributed", "ledger"]
categories = ["cryptography", "api-bindings"]
license = "MIT"

[dependencies]
# FIPS 204 ML-DSA. Pure Rust, no C toolchain, and verified against the
# ledger's published vectors: it decodes the exact 1952/4032 encodings the
# ledger stores, with no wrapping or re-encoding step.
fips204 = "0.4"
base64 = "0.22"
hex = "0.4"

# secp256k1. RustCrypto, pure Rust, no C toolchain. Its signing is already
# RFC 6979 deterministic with S normalised low, which matches the reference
# implementation byte for byte - but its VERIFICATION rejects high-S, which
# the ledger produces freely, so that path is handled explicitly.
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-stream = "0.3"

# rustls rather than native-tls: the previous release vendored and compiled
# OpenSSL, which made this crate need a C toolchain to build at all.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
