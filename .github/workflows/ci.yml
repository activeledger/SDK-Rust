name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The MSRV declared in Cargo.toml, plus current stable. A library
        # that only builds on its development toolchain breaks for half its
        # consumers, and nothing else here would notice.
        rust: ["1.88", "stable"]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - run: cargo build --all-targets
      - run: cargo test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # Catches anything that would break publishing, without publishing.
      - run: cargo package --allow-dirty
