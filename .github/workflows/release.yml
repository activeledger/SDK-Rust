# Cuts a release: test -> bump -> commit -> tag -> push -> publish -> verify.
#
# Dispatched by hand with a version rather than triggered by a tag. GitHub does
# not start new workflow runs from events created with the default
# GITHUB_TOKEN, so `on: push: tags` never fires for a tag a workflow pushed.
#
# The last job is the one that matters. The API accepting an upload proves
# nothing; depending on it from a fresh project does.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 2.4.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # README.md is included with #[doc = include_str!], so every ```rust
      # block in it is a doctest. --all-targets does NOT run those, which is
      # how a broken example once reached CI.
      - name: Test
        run: |
          cargo test --all-targets
          cargo test --doc

      - name: Bump
        run: |
          set -eu
          v="${{ inputs.version }}"
          sed -i "0,/^version = \".*\"/s//version = \"$v\"/" Cargo.toml
          cargo metadata --no-deps --format-version 1 \
            | grep -q "\"version\":\"$v\"" || { echo "bump did not take"; exit 1; }

      - name: Package
        run: cargo package --allow-dirty

      - name: Commit, tag and push
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "v${{ inputs.version }}"
          git push origin HEAD:master
          git push origin "v${{ inputs.version }}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ inputs.version }}" --title "v${{ inputs.version }}" --generate-notes

  publish:
    needs: release
    runs-on: ubuntu-latest
    outputs:
      # The `secrets` context is NOT available in a job-level `if`, so a
      # downstream job cannot gate on the token directly - it would evaluate
      # empty, skip silently, and the verification would never run again.
      # Carry the answer as an output instead.
      published: ${{ steps.push.outcome == 'success' }}
    env:
      # Skipped rather than failed when the secret is absent, so the GitHub
      # release above still stands on a repository that has no crates.io token
      # configured yet.
      TOKEN_SET: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "v${{ needs.release.outputs.version }}"
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        id: push
        if: ${{ env.TOKEN_SET == 'true' }}
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"

      - name: Say so when skipped
        if: ${{ env.TOKEN_SET != 'true' }}
        run: echo "::warning::CARGO_REGISTRY_TOKEN is not set - skipped crates.io"

  verify:
    needs: [release, publish]
    if: ${{ needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - name: Depend on it from a fresh project
        run: |
          set -eu
          v="${{ needs.release.outputs.version }}"
          cargo new --bin consumer && cd consumer
          for i in $(seq 1 10); do
            cargo add "activeledger@$v" && break
            echo "not on crates.io yet (attempt $i)"; sleep 20
          done
          cat > src/main.rs <<'RS'
          use activeledger::canonical::js_number;
          fn main() {
              // The number formatting is the thing a bad build loses quietly.
              assert_eq!(js_number(1e-7), "1e-7");
              assert_eq!(js_number(1e21), "1e+21");
              println!("registry install verified");
          }
          RS
          cargo run
